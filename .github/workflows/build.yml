on: [ pull_request ]

name: Build RELION

jobs:
  build_on_x86_64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        altcpu: [ON, OFF]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q -y && \
          sudo apt-get install -q -y cmake git build-essential mpi-default-bin mpi-default-dev libfftw3-dev libtiff-dev libpng-dev libtbb-dev libfltk1.3-dev python3
      - name: Build RELION for Linux x86_64
        run: mkdir build && cd build && cmake -DALTCPU=${{ matrix.altcpu }} -DCUDA=OFF -DFETCH_WEIGHTS=OFF -DPYTHON_EXE_PATH=/usr/bin/python3 -DTORCH_HOME_PATH=/tmp .. && make

  build_on_aarch64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        altcpu: [ON, OFF]
    steps:
      - uses: actions/checkout@v7
      - name: Build RELION for Linux aarch64
        uses: uraimo/run-on-arch-action@v3.1.0
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/relion" 
          install: |
            apt-get update -q -y
            apt-get install -q -y cmake git build-essential mpi-default-bin mpi-default-dev libfftw3-dev libtiff-dev libpng-dev libtbb-dev libfltk1.3-dev python3
          run: |
            cd /relion
            mkdir build
            cd build
            cmake -DALTCPU=${{ matrix.altcpu }} -DCUDA=OFF -DFETCH_WEIGHTS=OFF -DPYTHON_EXE_PATH=/usr/bin/python3 -DTORCH_HOME_PATH=/tmp ..
            make

  build_with_cuda:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:1608a19a5d6f013d36abfb9ad50a42b4c0ef86f4ab48e351c6899f0280b946c1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update -q -y
          DEBIAN_FRONTEND=noninteractive apt-get install -q -y \
            build-essential \
            cmake \
            git \
            libfftw3-dev \
            libfltk1.3-dev \
            libpng-dev \
            libtiff-dev \
            mpi-default-bin \
            mpi-default-dev \
            python3
      - name: Build with CUDA
        run: |
          cmake -S . -B build -DCUDA=ON -DALTCPU=OFF -DFETCH_WEIGHTS=OFF -DPYTHON_EXE_PATH=/usr/bin/python3 -DTORCH_HOME_PATH=/tmp
          cmake --build build --parallel 2

  build_with_hip:
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-22.04:7.1.1-complete@sha256:3d5c52ee04ba79a3bae0fced468906619a1451f923c7da5c1c28c59fb2c74be3
    env:
      HIP_PATH: /opt/rocm
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update -q -y
          DEBIAN_FRONTEND=noninteractive apt-get install -q -y \
            build-essential \
            cmake \
            git \
            libfftw3-dev \
            libfltk1.3-dev \
            libpng-dev \
            libtbb-dev \
            libtiff-dev \
            mpi-default-bin \
            mpi-default-dev \
            python3
      - name: Build with HIP
        run: |
          cmake -S . -B build -DCUDA=OFF -DHIP=ON -DALTCPU=OFF -DAMDFFTW=ON -DFETCH_WEIGHTS=OFF -DFORCE_OWN_FFTW=ON -DGUI=OFF -DHIP_ARCH=gfx90a,gfx908 -DPYTHON_EXE_PATH=/usr/bin/python3 -DTORCH_HOME_PATH=/tmp
          cmake --build build --parallel 2

  build_with_sycl:
    runs-on: ubuntu-latest
    container:
      image: intel/oneapi-hpckit:2025.3.1-0-devel-ubuntu22.04@sha256:398cbb946c0047f0cb2a6a82263a93b9c23cc0fba2a0f4aa3a95aae164dd776b
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update -q -y
          DEBIAN_FRONTEND=noninteractive apt-get install -q -y \
            build-essential \
            cmake \
            git \
            libfftw3-dev \
            libfltk1.3-dev \
            libpng-dev \
            libtbb-dev \
            libtiff-dev \
            python3
      - name: Build with SYCL
        run: |
          cmake -S . -B build -DCUDA=OFF -DSYCL=ON -DALTCPU=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=mpiicpx -DCMAKE_C_COMPILER=mpiicx -DFETCH_WEIGHTS=OFF -DGUI=OFF -DMKLFFT=ON -DMPI_CXX_COMPILER=mpiicpx -DMPI_C_COMPILER=mpiicx -DPYTHON_EXE_PATH=/usr/bin/python3 -DTORCH_HOME_PATH=/tmp
          cmake --build build --parallel 2
